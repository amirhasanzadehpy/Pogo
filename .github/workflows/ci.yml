name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  django-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        django: ["42", "52"]
        exclude:
          - python: "3.13"
            django: "42"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: make fixture-env FIXTURE_CONSTRAINTS=testdata/sample_django_project/constraints-django${{ matrix.django }}.txt
      - run: make test
      - run: make build
      - run: build/testclient -scenario testdata/requests/worker-lifecycle.json -- build/pogo -project testdata/sample_django_project -settings sample_project.settings -python .venv-fixture/bin/python

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: make fixture-env
      - run: make test-race

  native-transport:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - shell: bash
        run: |
          python -m venv .venv-fixture
          if [[ "$RUNNER_OS" == "Windows" ]]; then PY=.venv-fixture/Scripts/python.exe; else PY=.venv-fixture/bin/python; fi
          "$PY" -m pip install -r testdata/sample_django_project/requirements.txt -c testdata/sample_django_project/constraints-django52.txt
      - shell: bash
        run: |
          EXTRA=()
          if [[ "$RUNNER_OS" == "macOS" ]]; then EXTRA=(-ldflags=-linkmode=external); fi
          go test -tags=grammar_subset,grammar_subset_python "${EXTRA[@]}" ./...
          go build -tags=grammar_subset,grammar_subset_python "${EXTRA[@]}" ./cmd/pogo ./cmd/testclient

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags=grammar_subset,grammar_subset_python ./cmd/pogo ./cmd/testclient
      - run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags=grammar_subset,grammar_subset_python ./cmd/pogo ./cmd/testclient
      - run: make release-check

  performance-gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: make fixture-env
      - run: make bench
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ runner.os }}
          path: benchmark-results/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [django-compat, race, native-transport, cross-build, performance-gates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22.x"
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/vscode/package-lock.json
      - name: Validate release version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must match vX.Y.Z: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          extension_version="$(node -p "require('./client/vscode/package.json').version")"
          if [[ "$extension_version" != "$version" ]]; then
            echo "VS Code extension version $extension_version does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          fi
          git fetch origin main
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "release tag must point to a commit already on main" >&2
            exit 1
          fi
      - name: Build release binaries
        shell: bash
        run: |
          mkdir -p dist/stage
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            stage="dist/stage/${goos}-${goarch}"
            artifact="pogo-${GITHUB_REF_NAME}-${goos}-${goarch}"
            mkdir -p "$stage"
            executable="$stage/pogo"
            if [[ "$goos" == "windows" ]]; then executable="$executable.exe"; fi
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build \
              -trimpath -tags=grammar_subset,grammar_subset_python -ldflags='-s -w' \
              -o "$executable" ./cmd/pogo
            if [[ "$goos" == "windows" ]]; then
              zip -j "dist/${artifact}.zip" "$executable"
            else
              tar -C "$stage" -czf "dist/${artifact}.tar.gz" pogo
            fi
          done
          expected="pogo ${GITHUB_REF_NAME#v}"
          actual="$(dist/stage/linux-amd64/pogo -version 2>&1)"
          if [[ "$actual" != "$expected" ]]; then
            echo "release binary reports $actual, expected $expected" >&2
            exit 1
          fi
          python3 scripts/check_release.py dist/stage/*/pogo*
      - name: Build VS Code extension
        working-directory: client/vscode
        run: |
          npm ci --include=dev
          npm run package -- --out "../../dist/pogo-${GITHUB_REF_NAME#v}.vsix"
      - name: Generate checksums
        shell: bash
        run: |
          rm -rf dist/stage
          cd dist
          sha256sum pogo-* > checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Pogo ${GITHUB_REF_NAME#v}"
